<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#050a18" />
      <stop offset="0.55" stop-color="#0a1224" />
      <stop offset="1" stop-color="#0f1a2f" />
    </linearGradient>
    <radialGradient id="glow" cx="0.85" cy="0.15" r="0.7">
      <stop offset="0" stop-color="rgba(16,185,129,0.45)" />
      <stop offset="0.5" stop-color="rgba(16,185,129,0.10)" />
      <stop offset="1" stop-color="rgba(16,185,129,0)" />
    </radialGradient>
    <linearGradient id="text" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e6ecf5" />
      <stop offset="0.7" stop-color="#34d399" />
      <stop offset="1" stop-color="#10b981" />
    </linearGradient>
    <pattern id="grid" width="56" height="56" patternUnits="userSpaceOnUse">
      <path d="M 56 0 L 0 0 0 56" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="1" />
    </pattern>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)" />
  <rect width="1200" height="630" fill="url(#grid)" />
  <rect width="1200" height="630" fill="url(#glow)" />

  <!-- Accent bar -->
  <rect x="80" y="80" width="64" height="6" rx="3" fill="#10b981" />

  <!-- Kicker -->
  <text x="80" y="150" fill="#34d399" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="700" letter-spacing="6">
    ANDROID DEVELOPER · KOTLIN · JETPACK COMPOSE
  </text>

  <!-- Title -->
  <text x="80" y="270" fill="url(#text)" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="92" font-weight="800" letter-spacing="-2">
    Molham Alnaeb
  </text>

  <!-- Subtitle -->
  <text x="80" y="340" fill="#9aa7bd" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="32" font-weight="500">
    Building Android products that solve real problems.
  </text>

  <!-- Tag chips -->
  <g font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="600">
    <g transform="translate(80, 430)">
      <rect width="200" height="48" rx="24" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.35)" />
      <text x="100" y="31" text-anchor="middle" fill="#34d399">Kotlin</text>
    </g>
    <g transform="translate(296, 430)">
      <rect width="280" height="48" rx="24" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.35)" />
      <text x="140" y="31" text-anchor="middle" fill="#34d399">Jetpack Compose</text>
    </g>
    <g transform="translate(592, 430)">
      <rect width="220" height="48" rx="24" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.35)" />
      <text x="110" y="31" text-anchor="middle" fill="#34d399">REST APIs</text>
    </g>
    <g transform="translate(828, 430)">
      <rect width="200" height="48" rx="24" fill="rgba(16,185,129,0.12)" stroke="rgba(16,185,129,0.35)" />
      <text x="100" y="31" text-anchor="middle" fill="#34d399">SQLite</text>
    </g>
  </g>

  <!-- Footer line -->
  <text x="80" y="570" fill="#6b7891" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="20" font-weight="500">
    Aleppo, Syria · Available for Android & Mobile Engineering roles
  </text>
</svg>
